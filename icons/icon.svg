<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- PromptMeter: a gauge whose needle points into the "efficient" zone, with a leaf
       for the carbon saving. Shapes are thick and few so the mark survives at 16px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#15461A"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Gauge track, then the filled "saved" portion of it. -->
  <path d="M26 84 A38 38 0 0 1 102 84" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="12" stroke-linecap="round"/>
  <path d="M26 84 A38 38 0 0 1 84.9 52.3" fill="none" stroke="#A5D6A7"
        stroke-width="12" stroke-linecap="round"/>
  <!-- Needle and hub. -->
  <path d="M64 84 L88 57" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="64" cy="84" r="10" fill="#FFFFFF"/>
  <!-- Leaf, bottom right. -->
  <path d="M86 104 C86 92 96 86 108 86 C108 98 100 106 86 104 Z" fill="#C8E6C9"/>
  <path d="M88 102 L103 90" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
</svg>
