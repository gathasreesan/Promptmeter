<!DOCTYPE html>
<html lang="en" class="pm-tokens">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptMeter</title>
    <!-- Tokens first, then the bundled app styles which read them. No webfont is
         fetched -- the extension has to work with no connection after install. -->
    <link rel="stylesheet" href="../utils/tokens.css">
    <link rel="stylesheet" href="dist/bundle.css">
    <style>
        /* Only layout here. Colours come from the token blocks in bundle.css so the
           page cannot disagree with the active theme. */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            overflow-x: hidden;
        }
    </style>
    <!-- Runs before first paint so the page never flashes light before React mounts.
         External because MV3 extension pages run under script-src 'self'. -->
    <script src="../utils/theme-boot.js"></script>
</head>
<body>
    <div id="root"></div>
    <!-- Load local bundled JavaScript -->
    <script src="dist/bundle.js"></script>
</body>
</html>
